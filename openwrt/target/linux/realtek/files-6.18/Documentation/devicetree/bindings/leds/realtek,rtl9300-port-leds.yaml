%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/realtek,rtl9300-port-leds.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL9300 switch port LEDs under software control

maintainers:
  - OpenWrt Developers <openwrt-devel@lists.openwrt.org>

description: |
  The RTL9300 switch drives up to four LEDs per port over its serial LED
  interface, each normally showing a hardware function chosen by the LED set
  of the port. The LEDs listed here are taken over by software instead and
  switched on and off as LED class devices, for port LEDs that have no
  hardware function such as the PoE status LED of a PoE switch. The node is
  a child of the switch, whose registers it uses.

properties:
  compatible:
    const: realtek,rtl9300-port-leds

  "#address-cells":
    const: 2

  "#size-cells":
    const: 0

patternProperties:
  "^led@[0-9a-f]+,[0-3]$":
    $ref: /schemas/leds/common.yaml#
    unevaluatedProperties: false

    properties:
      reg:
        items:
          - items:
              - description: Switch port
                maximum: 27
              - description: LED of the port, 0 being the first in the
                  serial LED stream
                maximum: 3

    required:
      - reg

required:
  - compatible
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/leds/common.h>

    port-leds {
        compatible = "realtek,rtl9300-port-leds";
        #address-cells = <2>;
        #size-cells = <0>;

        led@0,2 {
            reg = <0 2>;
            color = <LED_COLOR_ID_GREEN>;
            function = "poe";
            function-enumerator = <1>;
        };

        led@8,2 {
            reg = <8 2>;
            color = <LED_COLOR_ID_GREEN>;
            function = "poe";
            function-enumerator = <2>;
        };
    };
