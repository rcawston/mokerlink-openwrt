name: rtl930x-switch

# The RTL930x switch driver and MDIO polling series for netdev, built on the
# tip of net-next, and a RAM-boot test image of both for the MokerLink
# POE-10G07110GSM
on:
  push:
    paths:
      - 'upstream/linux/rtl930x-switch/**'
      - 'upstream/linux/mdio-polling/**'
      - 'scripts/check-rtl930x-switch.sh'
      - 'scripts/check-mdio-polling.sh'
      - 'scripts/build-rtl930x-test-image.sh'
      - 'scripts/make-upstream.py'
      - '.github/workflows/rtl930x-switch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev \
            gcc-mips-linux-gnu python3-ply python3-git codespell \
            pkg-config u-boot-tools device-tree-compiler cpio bzip2 xz-utils

      # net-next hands __typeof_unqual__ to sparse (compiler_types.h), which
      # the 0.6.4 release Ubuntu has can't parse
      - name: Build sparse
        env:
          SPARSE_TAG: v0.6.5-rc1
          SPARSE_COMMIT: 37156835e3d725b6d750f000be33ba3814bb2310
        run: |
          git clone -q --depth 1 --branch "$SPARSE_TAG" \
            https://git.kernel.org/pub/scm/devel/sparse/sparse.git \
            "$RUNNER_TEMP/sparse"
          test "$(git -C "$RUNNER_TEMP/sparse" rev-parse HEAD)" = "$SPARSE_COMMIT"
          make -C "$RUNNER_TEMP/sparse" -j"$(nproc)" PREFIX="$HOME/.local" install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # First, as the switch series' check leaves its series applied in the
      # shared clone for the test image
      - name: Apply, checkpatch and build the MDIO polling series
        run: scripts/check-mdio-polling.sh

      - name: Apply, checkpatch and build the series
        run: scripts/check-rtl930x-switch.sh

      - name: Build the test image
        run: scripts/build-rtl930x-test-image.sh

      - name: Upload the patches and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl930x-switch-${{ github.sha }}
          path: |
            build/check/rtl930x-switch/patches/
            build/check/rtl930x-switch/logs/
            build/check/mdio-polling/patches/
            build/check/mdio-polling/logs/
          if-no-files-found: ignore

      - name: Upload the test image
        uses: actions/upload-artifact@v4
        with:
          name: rtl930x-switch-test-image-${{ github.sha }}
          path: build/check/rtl930x-switch/image/
          if-no-files-found: error
