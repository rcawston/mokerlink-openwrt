name: build

# Documentation-only changes don't change the firmware, nor does the
# RTL930x switch driver series, which has a workflow of its own
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'upstream/linux/rtl930x-switch/**'
      - 'scripts/check-rtl930x-switch.sh'
      - 'scripts/build-rtl930x-test-image.sh'
      - '.github/workflows/rtl930x-switch.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'upstream/linux/rtl930x-switch/**'
      - 'scripts/check-rtl930x-switch.sh'
      - 'scripts/build-rtl930x-test-image.sh'
      - '.github/workflows/rtl930x-switch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler shellcheck

      - name: Shellcheck
        run: shellcheck -x scripts/*.sh files/usr/sbin/mokerlink-* files/etc/init.d/mokerlink* files/etc/uci-defaults/* files/lib/functions/mokerlink.sh

      - name: U-Boot wiring decoder test
        run: python3 tests/test_uboot_wiring.py

      - name: Serial collector test
        run: pip install pyserial && python3 tests/test_uboot_collect.py

      - name: Device tree and patch checks
        run: scripts/check-dts.sh

      - name: Upstream patches build
        run: python3 scripts/make-upstream.py patches --author "CI <ci@example.org>" -o "$RUNNER_TEMP/upstream"

  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libelf-dev libssl-dev

      - name: PSE core fix on the net tree
        run: scripts/check-kernel.sh

  firmware:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # An OpenWrt build needs ~20 GB; the runner image ships with ~14 GB free.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: build/openwrt/dl
          key: dl-${{ hashFiles('config/openwrt.env', 'config/feeds.conf', 'config/mokerlink.diffconfig') }}
          restore-keys: dl-

      - name: Build
        run: scripts/build.sh

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: mokerlink-poe-10g07110gsm-${{ github.sha }}
          path: out/
          if-no-files-found: error
